name: Apply cloze learning-history patches

on:
  push:
    paths:
      - '.github/workflows/coin-reward-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cloze progress and previous answers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          tag='<script type="module" src="https://k-oota-pixel.github.io/english-playroom/coin-reward.js"></script>'
          for name in ('index.html','public/index.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')

              if tag not in s:
                  s=s.replace('</body>',tag+'\n</body>')
              needle='window.readingLabCloud={\n  async recordAttempt(info){'
              repl=needle+'\n    window.EnglishPlayroomCoins?.awardCloze?.(info?.passageId);'
              if 'awardCloze?.(info?.passageId)' not in s:
                  if needle not in s:
                      raise SystemExit(f'reward hook target not found in {name}')
                  s=s.replace(needle,repl,1)

              if '.previous-attempt{' not in s:
                  css='.previous-attempt{margin:-8px 0 22px;background:white;border:1px solid #dce5f1;border-radius:12px;padding:0 16px;box-shadow:0 3px 12px #20345106}.previous-attempt summary{cursor:pointer;padding:12px 2px;font-weight:750;color:var(--accent)}.previous-attempt[open] summary{border-bottom:1px solid #e7edf5}.previous-attempt-body{padding:12px 2px 4px}.previous-meta{font-size:12px;color:#6b7a90;margin-bottom:8px}.previous-row{padding:10px 0;border-bottom:1px solid #edf1f6}.previous-row:last-child{border-bottom:0}.previous-answer{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.previous-answer strong{font-size:13px;color:#52647d}.previous-answer span{font-weight:750;color:var(--ink)}.previous-feedback{font-size:13px;color:#52647d;margin-top:5px;white-space:pre-wrap}'
                  if '.navigation{' not in s:
                      raise SystemExit(f'CSS target not found in {name}')
                  s=s.replace('.navigation{',css+'.navigation{',1)

              if 'id="previousAttempt"' not in s:
                  old='<div class="status" id="connection">AI判定対応</div></div><div class="grid">'
                  new='<div class="status" id="connection">AI判定対応</div></div><details id="previousAttempt" class="previous-attempt hidden"><summary id="previousAttemptSummary">前回のあなたの解答（1件）</summary><div id="previousAttemptBody" class="previous-attempt-body"></div></details><div class="grid">'
                  if old not in s:
                      raise SystemExit(f'UI target not found in {name}')
                  s=s.replace(old,new,1)

              if 'function refreshPassageOptions()' not in s:
                  helper='\n'.join([
                      "const CLOZE_PROGRESS_KEY='readinglab-eiken-cloze-progress-v1';",
                      "const CLOZE_HISTORY_KEY='readinglab-eiken-cloze-last-answers-v1';",
                      "function readProgressSnapshot(){try{return JSON.parse(localStorage.getItem(CLOZE_PROGRESS_KEY)||'{}')||{};}catch{return {};}}",
                      "function readAnswerHistory(){try{return JSON.parse(localStorage.getItem(CLOZE_HISTORY_KEY)||'{}')||{};}catch{return {};}}",
                      'function refreshPassageOptions(){',
                      '  const progress=readProgressSnapshot();',
                      '  const attempted=new Set(Array.isArray(progress.attemptedIds)?progress.attemptedIds:[]);',
                      '  const current=String(index);',
                      "  $('passageSelect').innerHTML=DATA.map((p,i)=>`<option value=\"${i}\">${attempted.has(p.id)?'✓ ':''}${String(i+1).padStart(2,'0')} ${esc(p.title)}</option>`).join('');",
                      "  $('passageSelect').value=current;",
                      '}',
                      'function renderPreviousAttempt(){',
                      "  const box=$('previousAttempt'),body=$('previousAttemptBody');",
                      '  if(!box||!body)return;',
                      '  const attempt=readAnswerHistory()[DATA[index].id];',
                      "  if(!attempt||!Array.isArray(attempt.answers)||!attempt.answers.length){box.classList.add('hidden');box.open=false;body.innerHTML='';return;}",
                      "  box.classList.remove('hidden');",
                      "  $('previousAttemptSummary').textContent='前回のあなたの解答（1件）';",
                      '  const rows=attempt.answers.map(a=>{',
                      "    const feedback=a.feedback?`<div class=\"previous-feedback\">${esc(a.feedback)}</div>`:'';",
                      "    return `<div class=\"previous-row\"><div class=\"previous-answer\"><strong>空所 (${esc(a.number)})</strong><span>${esc(a.answer||'')}</span></div>${feedback}</div>`;",
                      "  }).join('');",
                      "  let saved='';if(Number(attempt.savedAt)){try{saved=new Date(Number(attempt.savedAt)).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch{}}",
                      "  const modeText=attempt.mode==='choice'?'4択':'自分で入力';",
                      "  body.innerHTML=`<div class=\"previous-meta\">${esc(modeText)}${saved?' · '+esc(saved):''}</div>${rows}`;",
                      '}',
                      'function saveCurrentAttemptFromPage(info){',
                      '  if(!info?.passageId)return;',
                      '  const answers=[];',
                      "  if(info.mode==='choice'){",
                      "    document.querySelectorAll('#tasks .choice.selected').forEach(el=>{const n=Number(el.dataset.q);const text=el.textContent.replace(/^\\s*\\d+\\s*/, '').trim();const fb=document.getElementById('feedback'+n)?.innerText?.trim()||'';answers.push({number:n,answer:text,feedback:fb});});",
                      '  }else{',
                      "    document.querySelectorAll('#tasks input[data-number]').forEach(el=>{const n=Number(el.dataset.number);const fb=document.getElementById('feedback'+n)?.innerText?.trim()||'';answers.push({number:n,answer:el.value.trim(),feedback:fb});});",
                      '  }',
                      '  if(!answers.length)return;',
                      '  const h=readAnswerHistory();',
                      '  h[info.passageId]={savedAt:Date.now(),mode:info.mode,answers};',
                      '  localStorage.setItem(CLOZE_HISTORY_KEY,JSON.stringify(h));',
                      '  refreshPassageOptions();renderPreviousAttempt();',
                      '}',
                      'window.readingLabSaveCurrentAttempt=saveCurrentAttemptFromPage;',
                      ''
                  ])
                  if 'function render(){' not in s:
                      raise SystemExit(f'render target not found in {name}')
                  s=s.replace('function render(){',helper+'function render(){',1)

              if "$('passageSelect').value=index;renderPreviousAttempt();" not in s:
                  target="$('passageSelect').value=index;"
                  if target not in s:
                      raise SystemExit(f'render history target not found in {name}')
                  s=s.replace(target,target+'renderPreviousAttempt();',1)

              if "refreshPassageOptions();$('passageSelect').onchange" not in s:
                  pattern=r"\$\('passageSelect'\)\.innerHTML=DATA\.map\(\(p,i\)=>.*?\.join\(''\);\$\('passageSelect'\)\.onchange"
                  s,n=re.subn(pattern,"refreshPassageOptions();$('passageSelect').onchange",s,count=1,flags=re.S)
                  if n!=1:
                      raise SystemExit(f'select target not found in {name}')

              hook='window.readingLabSaveCurrentAttempt?.(info);'
              if hook not in s:
                  target='writeLocal(s);'
                  if target not in s:
                      raise SystemExit(f'recordAttempt write target not found in {name}')
                  s=s.replace(target,target+'\n    '+hook,1)

              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html public/index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public/index.html
          git commit -m "Show completed cloze passages and latest answers"
          git push
